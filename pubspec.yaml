name: zxing_dart
description: >-
  Barcode encode and decode with zxing-cpp: native through FFI, web through
  a WebAssembly worker. Bytes in, bytes out.
version: 0.1.0
repository: https://github.com/Telosnex/zxing_dart
issue_tracker: https://github.com/Telosnex/zxing_dart/issues

environment:
  sdk: ^3.12.2

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ^2.0.2
  kiln: ^0.1.1

dev_dependencies:
  # Independent pure-Dart Aztec encoder oracle for the conformance corpus.
  barcode: 2.2.9
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.28.0
