name: zxing_dart
description: >-
  Pinned zxing-cpp behind a stable C ABI with one universal Dart entrypoint.
  Native (FFI) + web (WASM worker) backends; camera-agnostic bytes-in /
  bytes-out. Follows the image_ffmpeg porting template.
version: 0.1.0-dev
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ^2.0.2
  native_prebuilt:
    git:
      url: https://github.com/Telosnex/native_prebuilt.git
      ref: bf489921cbd79f96a41d3ac08d88df6cdab97366

dev_dependencies:
  # Independent pure-Dart Aztec encoder oracle for the conformance corpus.
  barcode: 2.2.9
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.28.0
