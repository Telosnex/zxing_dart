name: zxing_dart
description: >-
  Pinned zxing-cpp behind a stable C ABI with one universal Dart entrypoint.
  Native (FFI) + web (WASM worker) backends; camera-agnostic bytes-in /
  bytes-out. Follows the image_ffmpeg porting template.
version: 0.1.0-dev
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ^1.0.0

dev_dependencies:
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.28.0
