name: zxing_dart
description: >-
  Pinned zxing-cpp behind a stable C ABI with one universal Dart entrypoint.
  Native (FFI) + web (WASM worker) backends; camera-agnostic bytes-in /
  bytes-out. Follows the image_ffmpeg porting template.
version: 0.1.0-dev
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ^1.0.0

dev_dependencies:
  # Independent pure-Dart Aztec encoder oracle for the conformance corpus.
  barcode: 2.2.9
  ffigen: ^20.1.1
  lints: ^6.0.0
  test: ^1.28.0

# Flutter serves these at assets/packages/zxing_dart/web/. Plain Dart browser
# consumers serve lib/web/ themselves and configure ZxingDartWeb.workerUri.
flutter:
  assets:
    - packages/zxing_dart/web/zxing_dart_worker.mjs
    - packages/zxing_dart/web/zxing_dart_loader.mjs
    - packages/zxing_dart/web/zxing_dart_module.mjs
    - packages/zxing_dart/web/zxing_dart_module.wasm
